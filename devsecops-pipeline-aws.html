<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shift-left DevSecOps pipeline on AWS</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:#0a0a0f}
body{display:flex;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
svg{width:100%;max-width:760px;height:auto;display:block}
text{fill:#e5e7eb}
.t{font-size:15px;font-weight:600}
.s{font-size:12px;fill:#9ca3af}
.r{font-size:13px;fill:#d1d5db}
</style></head><body>
<svg viewBox="0 0 760 950" role="img" aria-label="Shift-left DevSecOps pipeline on AWS architecture diagram">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="950" fill="#0a0a0f"/>
<rect x="18" y="18" width="78" height="30" rx="8" fill="#1f2937"/><text x="57" y="38" text-anchor="middle" style="font-size:14px;font-weight:600">Cloud</text>
<text x="380" y="70" text-anchor="middle" style="font-size:30px;font-weight:800;letter-spacing:.5px">SHIFT-LEFT DEVSECOPS</text>
<text x="380" y="106" text-anchor="middle" style="font-size:30px;font-weight:800;letter-spacing:.5px">PIPELINE ON AWS</text>

<rect x="108" y="130" width="64" height="64" rx="14" fill="#15151d" stroke="#a855f7" stroke-width="1.5"/>
<g fill="none" stroke="#e5e7eb" stroke-width="2.4" stroke-linecap="round"><circle cx="128" cy="150" r="4"/><circle cx="128" cy="174" r="4"/><circle cx="154" cy="156" r="4"/><path d="M128 154v16M154 160c0 8-12 8-26 10" /></g>
<text class="t" x="140" y="217" text-anchor="middle">GitHub</text><text class="s" x="140" y="235" text-anchor="middle">Pull request / push</text>

<rect x="348" y="130" width="64" height="64" rx="14" fill="#15151d" stroke="#a855f7" stroke-width="1.5"/>
<circle cx="380" cy="162" r="18" fill="none" stroke="#e5e7eb" stroke-width="2.4"/><path d="M374 153l14 9-14 9z" fill="#a855f7"/>
<text class="t" x="380" y="217" text-anchor="middle">GitHub Actions</text><text class="s" x="380" y="235" text-anchor="middle">Lint, audit, Trivy, build</text>

<rect x="588" y="130" width="64" height="64" rx="14" fill="#15151d" stroke="#38bdf8" stroke-width="1.5"/>
<g fill="#38bdf8"><rect x="600" y="160" width="9" height="9" rx="1.5"/><rect x="611" y="160" width="9" height="9" rx="1.5"/><rect x="622" y="160" width="9" height="9" rx="1.5"/><rect x="611" y="149" width="9" height="9" rx="1.5"/><rect x="633" y="160" width="9" height="9" rx="1.5"/></g>
<path d="M596 172c4 14 20 18 38 14 8-2 12-8 14-14" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
<text class="t" x="620" y="217" text-anchor="middle">Docker Hub</text><text class="s" x="620" y="235" text-anchor="middle">Scanned images</text>

<line x1="176" y1="162" x2="344" y2="162" stroke="#a855f7" stroke-width="2" marker-end="url(#a)"/>
<line x1="416" y1="162" x2="584" y2="162" stroke="#38bdf8" stroke-width="2" marker-end="url(#a)"/>
<path d="M656 162H700V266H230V396" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text class="s" x="470" y="258" text-anchor="middle">Merge to main</text>

<rect x="30" y="290" width="700" height="500" rx="14" fill="none" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="7 5"/>
<rect x="42" y="300" width="64" height="22" rx="5" fill="#1f2937"/><text x="74" y="316" text-anchor="middle" style="font-size:12px;font-weight:600">AWS Cloud</text>
<rect x="46" y="332" width="668" height="442" rx="12" fill="none" stroke="#2dd4bf" stroke-width="1.4" stroke-dasharray="7 5"/>
<text class="s" x="60" y="350" style="fill:#2dd4bf">Region</text>
<rect x="62" y="360" width="636" height="398" rx="12" fill="none" stroke="#a855f7" stroke-width="1.6"/>
<text class="s" x="76" y="378" style="fill:#c084fc">VPC</text>
<rect x="78" y="388" width="604" height="354" rx="12" fill="none" stroke="#84cc16" stroke-width="1.4" stroke-dasharray="7 5"/>
<text class="s" x="92" y="406" style="fill:#a3e635">Public subnet</text>

<g id="cards"></g>
<line x1="364" y1="560" x2="396" y2="560" stroke="#f97316" stroke-width="2" marker-end="url(#a)"/>
<text class="s" x="380" y="546" text-anchor="middle">Approval</text>

<line x1="530" y1="728" x2="530" y2="818" stroke="#f59e0b" stroke-width="2" marker-end="url(#a)"/>
<rect x="498" y="822" width="64" height="64" rx="14" fill="#15151d" stroke="#f59e0b" stroke-width="1.5"/>
<path d="M530 840c-8 0-12 7-12 14v10l-5 6h34l-5-6v-10c0-7-4-14-12-14z" fill="none" stroke="#e5e7eb" stroke-width="2.4" stroke-linejoin="round"/><path d="M525 874c1 4 9 4 10 0" fill="none" stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round"/>
<text class="t" x="530" y="910" text-anchor="middle">Discord / Slack</text><text class="s" x="530" y="928" text-anchor="middle">Alertmanager notifications</text>
</svg>
<script>
var cards=[{x:100,c:"#2dd4bf",n:"Staging EC2",s:"Deploys on merge"},{x:400,c:"#f97316",n:"Production EC2",s:"Deploys after approval"}];
var svc=[["Nginx","#22c55e"],["React frontend","#38bdf8"],["Node API","#84cc16"],["PostgreSQL","#60a5fa"],["Prometheus","#f97316"],["Grafana","#fb923c"],["Alertmanager","#ef4444"]];
var h="";
cards.forEach(function(k){
h+='<rect x="'+k.x+'" y="416" width="260" height="312" rx="12" fill="#12121a" stroke="'+k.c+'" stroke-width="1.5"/>';
h+='<rect x="'+(k.x+14)+'" y="428" width="40" height="40" rx="9" fill="#1c1c26" stroke="'+k.c+'" stroke-width="1.2"/>';
h+='<g fill="none" stroke="'+k.c+'" stroke-width="2"><rect x="'+(k.x+25)+'" y="439" width="18" height="18" rx="2"/><path d="M'+(k.x+30)+' 435v4M'+(k.x+38)+' 435v4M'+(k.x+30)+' 457v4M'+(k.x+38)+' 457v4M'+(k.x+21)+' 444h4M'+(k.x+21)+' 452h4M'+(k.x+43)+' 444h4M'+(k.x+43)+' 452h4"/></g>';
h+='<text class="t" x="'+(k.x+64)+'" y="445">'+k.n+'</text><text class="s" x="'+(k.x+64)+'" y="463">'+k.s+'</text>';
svc.forEach(function(v,i){var y=482+i*34;
h+='<rect x="'+(k.x+14)+'" y="'+y+'" width="232" height="28" rx="7" fill="#1a1a24"/>';
h+='<circle cx="'+(k.x+30)+'" cy="'+(y+14)+'" r="5" fill="'+v[1]+'"/>';
h+='<text class="r" x="'+(k.x+44)+'" y="'+(y+19)+'">'+v[0]+'</text>';});
});
document.getElementById("cards").innerHTML=h;
</script>
</body></html>
