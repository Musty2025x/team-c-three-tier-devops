name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Commit SHA/image tag to deploy
        required: true
        type: string

permissions:
  contents: read

env:
  BACKEND_IMAGE: musty101/team-c-backend
  FRONTEND_IMAGE: musty101/team-c-frontend

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify production Compose file
        run: test -f docker-compose.prod.yml
      - name: Copy production Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /tmp/team-c-production
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script_stop: true
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            RELEASE_DIR="/opt/team-c/releases/${IMAGE_TAG}"
            sudo mkdir -p "${RELEASE_DIR}"
            sudo chown -R deployer:deployer /opt/team-c
            sudo cp /tmp/team-c-production/docker-compose.prod.yml "${RELEASE_DIR}/docker-compose.prod.yml"
            sudo chown deployer:deployer "${RELEASE_DIR}/docker-compose.prod.yml"
            printf 'IMAGE_TAG=%s\nDOCKERHUB_USERNAME=%s\n' "${IMAGE_TAG}" "${DOCKERHUB_USERNAME}" | sudo tee "${RELEASE_DIR}/.env" > /dev/null
            sudo chown deployer:deployer "${RELEASE_DIR}/.env"
            sudo -u deployer docker compose --env-file "${RELEASE_DIR}/.env" -f "${RELEASE_DIR}/docker-compose.prod.yml" config
            echo "${DOCKERHUB_TOKEN}" | sudo -u deployer docker login --username "${DOCKERHUB_USERNAME}" --password-stdin
            sudo -u deployer docker compose --env-file "${RELEASE_DIR}/.env" -f "${RELEASE_DIR}/docker-compose.prod.yml" pull
            sudo -u deployer docker compose --env-file "${RELEASE_DIR}/.env" -f "${RELEASE_DIR}/docker-compose.prod.yml" up -d
            sleep 20
            sudo -u deployer docker compose --env-file "${RELEASE_DIR}/.env" -f "${RELEASE_DIR}/docker-compose.prod.yml" ps
            sudo -u deployer docker compose --env-file "${RELEASE_DIR}/.env" -f "${RELEASE_DIR}/docker-compose.prod.yml" exec -T backend wget -qO- http://localhost:5000/api/health
            echo ""
            echo "PRODUCTION DEPLOYMENT SUCCESSFUL"
