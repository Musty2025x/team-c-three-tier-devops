name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tested Docker image tag / Git commit SHA"
        required: true
        type: string

permissions:
  contents: read

env:
  BACKEND_IMAGE: musty101/team-c-backend
  FRONTEND_IMAGE: musty101/team-c-frontend
  COMPOSE_PROJECT_NAME: team-c-production

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "$SSH_KEY" ]] || { echo "::error::PRODUCTION_SSH_KEY is missing"; exit 1; }
          [[ -n "$SSH_HOST" ]] || { echo "::error::PRODUCTION_HOST is missing"; exit 1; }
          [[ -n "$SSH_USER" ]] || { echo "::error::PRODUCTION_SSH_USER is missing"; exit 1; }
          [[ -n "$DOCKER_USER" ]] || { echo "::error::DOCKERHUB_USERNAME is missing"; exit 1; }
          [[ -n "$DOCKER_TOKEN" ]] || { echo "::error::DOCKERHUB_TOKEN is missing"; exit 1; }
          [[ -n "$DB_PASSWORD" ]] || { echo "::error::PRODUCTION_DB_PASSWORD is missing"; exit 1; }

          echo "Required deployment secrets are present."

      - name: Validate deployment files
        run: |
          set -e
          test -f docker-compose.prod.yml
          test -f nginx/nginx.conf
          echo "Production deployment files verified."

      - name: Copy production configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf"
          target: "/tmp/team-c-production"
          strip_components: 0
          overwrite: true

      - name: Verify copied production configuration
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }} 
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            test -f /tmp/team-c-production/docker-compose.prod.yml
            test -f /tmp/team-c-production/nginx/nginx.conf
            echo "Production configuration files verified."

      - name: Validate production SSH key format
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/production_key"
          chmod 600 "$RUNNER_TEMP/production_key"

          ssh-keygen -y -f "$RUNNER_TEMP/production_key" \
            > /dev/null

          echo "Production SSH key is valid and parseable."

      - name: Diagnose production SSH environment forwarding
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 1m
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,PRODUCTION_DB_PASSWORD
          script: |
            set -eu
            echo "SSH connection successful"
            test -n "$IMAGE_TAG"
            echo "Image tag received successfully"
            test -n "$DOCKERHUB_USERNAME"
            echo "Docker Hub username received successfully"
            test -n "$DOCKERHUB_TOKEN"
            echo "Docker Hub token received successfully"
            test -n "$PRODUCTION_DB_PASSWORD"
            echo "Database password received successfully"

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 10m
          script_stop: true
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,PRODUCTION_DB_PASSWORD
          script: |
            set -eu
            set +x

            echo "STEP 1: Validating deployment variables"
            printf '%s\n' "$IMAGE_TAG" | grep -Eq '^[a-f0-9]{40}$'
            test -n "$DOCKERHUB_USERNAME"
            test -n "$DOCKERHUB_TOKEN"
            test -n "$PRODUCTION_DB_PASSWORD"

            RELEASE_DIR="/opt/team-c/releases/${IMAGE_TAG}"
            COMPOSE_FILE="${RELEASE_DIR}/docker-compose.prod.yml"
            ENV_FILE="${RELEASE_DIR}/.env"

            echo "STEP 2: Creating release directories"
            sudo install -d -o deployer -g deployer \
              /opt/team-c/releases "$RELEASE_DIR" "$RELEASE_DIR/nginx"

            echo "STEP 3: Installing Compose configuration"
            sudo install -o deployer -g deployer -m 0644 \
              /tmp/team-c-production/docker-compose.prod.yml "$COMPOSE_FILE"

            sudo install -o deployer -g deployer -m 0644 \
              /tmp/team-c-production/nginx/nginx.conf \
              "$RELEASE_DIR/nginx/nginx.conf"

            echo "STEP 4: Writing protected environment file"
            sudo install -o deployer -g deployer -m 0600 /dev/null "$ENV_FILE"

            {
              printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
              printf 'DOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME"
              printf 'PRODUCTION_DB_PASSWORD=%s\n' "$PRODUCTION_DB_PASSWORD"
            } | sudo tee "$ENV_FILE" >/dev/null

            sudo chown deployer:deployer "$ENV_FILE"
            sudo chmod 0600 "$ENV_FILE"
            
            echo "STEP 5A: Checking Docker"
            sudo -u deployer docker --version

            echo "STEP 5B: Checking Docker Hub username"
            test -n "$DOCKERHUB_USERNAME"
            echo "Docker Hub username is present"

            echo "STEP 5C: Preparing Docker Hub login"
            LOGIN_FILE="$(mktemp)"
            chmod 600 "$LOGIN_FILE"
            trap 'rm -f "$LOGIN_FILE"' EXIT

            printf '%s' "$DOCKERHUB_TOKEN" > "$LOGIN_FILE"
            sudo install -o deployer -g deployer -m 0600 \
              "$LOGIN_FILE" /tmp/team-c-docker-token

            rm -f "$LOGIN_FILE"

            echo "STEP 5D: Logging in as deployer"
            sudo -u deployer sh -c '
              docker login \
                --username "$1" \
                --password-stdin < /tmp/team-c-docker-token
            ' sh "$DOCKERHUB_USERNAME"

            sudo rm -f /tmp/team-c-docker-token
            trap - EXIT
            echo "Docker Hub login succeeded"

            echo "STEP 6: Validating Compose configuration"
            sudo -u deployer docker compose \
              -p team-c-production --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" config -q

            echo "STEP 7: Pulling production images"
            sudo -u deployer docker compose \
              -p team-c-production --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" pull

            echo "STEP 8: Starting production containers"
            sudo -u deployer docker compose \
              -p team-c-production --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" up -d

            echo "STEP 9: Checking container status"
            sleep 30
            sudo -u deployer docker compose \
              -p team-c-production --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" ps

            echo "STEP 10: Checking backend health"
            sudo -u deployer docker compose \
              -p team-c-production --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" exec -T backend \
              wget -qO- http://localhost:5000/api/health

            echo
            echo "Production deployment and backend health check completed."
            echo "Image tag: $IMAGE_TAG"