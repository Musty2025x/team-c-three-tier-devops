name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tested Docker image tag / Git commit SHA"
        required: true
        type: string

permissions:
  contents: read

env:
  BACKEND_IMAGE: musty101/team-c-backend
  FRONTEND_IMAGE: musty101/team-c-frontend
  COMPOSE_PROJECT_NAME: team-c-production

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment files
        run: |
          set -e
          test -f docker-compose.prod.yml
          test -f nginx/nginx.conf
          echo "Production deployment files verified."

      - name: Copy production configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          source: "docker-compose.prod.yml,nginx/nginx.conf"
          target: "/tmp/team-c-production"
          strip_components: 0
          overwrite: true

      - name: Verify copied production configuration
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }} 
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            test -f /tmp/team-c-production/docker-compose.prod.yml
            test -f /tmp/team-c-production/nginx/nginx.conf
            echo "Production configuration files verified."

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PRODUCTION_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script_stop: true
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,PRODUCTION_DB_PASSWORD
          script: |
            set -eu
            set +x

            case "$IMAGE_TAG" in
              *[!a-f0-9]*|'')
                echo "ERROR: image_tag must be a hexadecimal commit SHA."
                exit 1
                ;;
            esac

            if [ "${#IMAGE_TAG}" -lt 40 ]; then
              echo "ERROR: provide the full 40-character commit SHA."
              exit 1
            fi

            test -n "$DOCKERHUB_USERNAME"
            test -n "$DOCKERHUB_TOKEN"
            test -n "$PRODUCTION_DB_PASSWORD"

            RELEASE_DIR="/opt/team-c/releases/${IMAGE_TAG}"
            COMPOSE_FILE="${RELEASE_DIR}/docker-compose.prod.yml"
            ENV_FILE="${RELEASE_DIR}/.env"

            sudo install -d -o deployer -g deployer \
              /opt/team-c/releases \
              "$RELEASE_DIR" \
              "$RELEASE_DIR/nginx"

            sudo install -o deployer -g deployer -m 0644 \
              /tmp/team-c-production/docker-compose.prod.yml \
              "$COMPOSE_FILE"

            sudo install -o deployer -g deployer -m 0644 \
              /tmp/team-c-production/nginx/nginx.conf \
              "$RELEASE_DIR/nginx/nginx.conf"

            sudo install -o deployer -g deployer -m 0600 \
              /dev/null "$ENV_FILE"

            {
              printf 'IMAGE_TAG=%s\n' "$IMAGE_TAG"
              printf 'DOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME"
              printf 'PRODUCTION_DB_PASSWORD=%s\n' "$PRODUCTION_DB_PASSWORD"
            } | sudo tee "$ENV_FILE" >/dev/null

            sudo chown deployer:deployer "$ENV_FILE"
            sudo chmod 0600 "$ENV_FILE"

            printf '%s' "$DOCKERHUB_TOKEN" |
              sudo -u deployer docker login \
                --username "$DOCKERHUB_USERNAME" \
                --password-stdin

            sudo -u deployer docker compose \
              -p team-c-production \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" config -q

            sudo -u deployer docker compose \
              -p team-c-production \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" pull

            sudo -u deployer docker compose \
              -p team-c-production \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" up -d

            sleep 30

            sudo -u deployer docker compose \
              -p team-c-production \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" ps

            sudo -u deployer docker compose \
              -p team-c-production \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" exec -T backend \
              wget -qO- http://localhost:5000/api/health

            echo
            echo "Production containers passed the backend health check."
            echo "Image tag: $IMAGE_TAG"

      - name: Notify Slack about production deployment failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.ALERTMANAGER_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":red_circle: Production deployment failed for `${{ github.repository }}` (image tag `${{ inputs.image_tag }}`). <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View workflow run>."
            }
