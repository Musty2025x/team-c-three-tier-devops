name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BACKEND_IMAGE: musty101/team-c-backend
  FRONTEND_IMAGE: musty101/team-c-frontend

jobs:
  test:
    name: Lint, Test and Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # -----------------------------
      # Backend
      # -----------------------------

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend lint
        working-directory: backend
        run: npm run lint

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=high

      # -----------------------------
      # Frontend
      # -----------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  security:
    name: Build and Scan Container Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            -t "${BACKEND_IMAGE}:${GITHUB_SHA}" \
            ./backend

      - name: Build frontend image
        run: |
          docker build \
            -t "${FRONTEND_IMAGE}:${GITHUB_SHA}" \
            ./frontend

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          scanners: vuln

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          scanners: vuln

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          scanners: vuln

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: security

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

      - name: Verify pushed images
        run: |
          echo "Backend image:"
          echo "${BACKEND_IMAGE}:${GITHUB_SHA}"

          echo "Frontend image:"
          echo "${FRONTEND_IMAGE}:${GITHUB_SHA}"

          docker buildx imagetools inspect \
            "${BACKEND_IMAGE}:${GITHUB_SHA}"

          docker buildx imagetools inspect \
            "${FRONTEND_IMAGE}:${GITHUB_SHA}"

          echo "Docker images successfully pushed."