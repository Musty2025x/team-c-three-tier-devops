name: Deploy Staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag / Git commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

env:
  BACKEND_IMAGE: musty101/team-c-backend
  FRONTEND_IMAGE: musty101/team-c-frontend

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    # Only deploy when CI succeeds on main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      # --------------------------------
      # Checkout exact commit that CI built
      # --------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # --------------------------------
      # Set image tag
      # --------------------------------

      - name: Set deployment image tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          fi

      # --------------------------------
      # Verify deployment file
      # --------------------------------

      - name: Verify staging Compose file
        run: |
          set -e

          test -f deploy/staging/docker-compose.yml

          echo "Staging Compose file found."

      # --------------------------------
      # Copy Compose file to EC2
      # --------------------------------

      - name: Copy staging Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: deploy/staging/docker-compose.yml
          target: /tmp/team-c-deploy

      # --------------------------------
      # Deploy to staging
      # --------------------------------

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN

          script: |
            set -e

            echo "=========================================="
            echo "Starting staging deployment"
            echo "=========================================="

            echo "Image tag:"
            echo "${IMAGE_TAG}"

            RELEASE_DIR="/opt/team-c/releases/${IMAGE_TAG}"

            # --------------------------------
            # Create release directory
            # --------------------------------

            sudo mkdir -p "${RELEASE_DIR}"

            sudo chown -R deployer:deployer /opt/team-c

            # --------------------------------
            # Copy Compose file
            # --------------------------------

            sudo cp \
              /tmp/team-c-deploy/deploy/staging/docker-compose.yml \
              "${RELEASE_DIR}/docker-compose.yml"

            sudo chown deployer:deployer \
              "${RELEASE_DIR}/docker-compose.yml"

            # --------------------------------
            # Create environment file
            # --------------------------------

            printf 'IMAGE_TAG=%s\nDOCKERHUB_USERNAME=%s\n' \
              "${IMAGE_TAG}" \
              "${DOCKERHUB_USERNAME}" \
              | sudo tee "${RELEASE_DIR}/.env" > /dev/null

            sudo chown deployer:deployer \
              "${RELEASE_DIR}/.env"

            # --------------------------------
            # Validate Compose
            # --------------------------------

            echo "Validating Docker Compose configuration..."

            sudo -u deployer docker compose \
              --env-file "${RELEASE_DIR}/.env" \
              -f "${RELEASE_DIR}/docker-compose.yml" \
              config

            # --------------------------------
            # Login to Docker Hub
            # --------------------------------

            echo "Logging into Docker Hub..."

            echo "${DOCKERHUB_TOKEN}" \
              | sudo -u deployer docker login \
                --username "${DOCKERHUB_USERNAME}" \
                --password-stdin

            # --------------------------------
            # Pull exact CI-built images
            # --------------------------------

            echo "Pulling application images..."

            sudo -u deployer docker compose \
              --env-file "${RELEASE_DIR}/.env" \
              -f "${RELEASE_DIR}/docker-compose.yml" \
              pull

            # --------------------------------
            # Start application
            # --------------------------------

            echo "Starting staging application..."

            sudo -u deployer docker compose \
              --env-file "${RELEASE_DIR}/.env" \
              -f "${RELEASE_DIR}/docker-compose.yml" \
              up -d

            # --------------------------------
            # Wait for application
            # --------------------------------

            echo "Waiting for application to start..."

            sleep 20

            # --------------------------------
            # Container status
            # --------------------------------

            echo "Container status:"

            sudo -u deployer docker compose \
              --env-file "${RELEASE_DIR}/.env" \
              -f "${RELEASE_DIR}/docker-compose.yml" \
              ps

            # --------------------------------
            # Backend health check
            # --------------------------------

            echo "Checking backend health..."

            sudo -u deployer docker compose \
              --env-file "${RELEASE_DIR}/.env" \
              -f "${RELEASE_DIR}/docker-compose.yml" \
              exec -T backend \
              wget -qO- http://localhost:5000/api/health

            echo ""

            echo "=========================================="
            echo "STAGING DEPLOYMENT SUCCESSFUL"
            echo "=========================================="