name: Deploy Staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag / Git commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      # 1. Check out the exact commit CI built.
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # 2. Determine the Docker image tag.
      - name: Set image tag
        id: set_image_tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_IMAGE_TAG"
          else
            TAG="$WORKFLOW_SHA"
          fi

          if [[ -z "$TAG" || ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag."
            exit 1
          fi

          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: $TAG"

      # 3. Verify all required deployment files.
      - name: Verify deployment files
        shell: bash
        run: |
          set -euo pipefail

          test -f deploy/staging/docker-compose.yml
          test -f nginx/nginx.conf
          test -f monitoring/prometheus/prometheus.yml
          test -f monitoring/prometheus/alerts.yml
          test -f monitoring/alertmanager/alertmanager.yml
          test -f monitoring/grafana/provisioning/datasources/datasource.yml
          test -f monitoring/grafana/provisioning/dashboards/dashboard.yml
          test -f monitoring/grafana/dashboards/team-c.json

          echo "All required deployment files are present."

      # 4. Package monitoring files to preserve directory structure.
      - name: Package monitoring configuration
        shell: bash
        run: |
          set -euo pipefail
          tar -czf monitoring-config.tar.gz monitoring/

      # 5. Copy Docker Compose file to staging.
      - name: Copy staging Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: deploy/staging/docker-compose.yml
          target: /tmp/team-c-deploy

      # 6. Copy Nginx configuration.
      - name: Copy Nginx configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: nginx/nginx.conf
          target: /tmp/team-c-nginx
          strip_components: 1

      # 7. Copy the monitoring archive.
      - name: Copy monitoring archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: monitoring-config.tar.gz
          target: /tmp/team-c-monitoring

      # 8. Prepare the release directory and install config files.
      - name: Prepare staging release
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.set_image_tag.outputs.image_tag }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          envs: IMAGE_TAG
          script: |
            set -eu

            test -f /tmp/team-c-deploy/deploy/staging/docker-compose.yml
            test -f /tmp/team-c-nginx/nginx.conf
            test -f /tmp/team-c-monitoring/monitoring-config.tar.gz

            sudo mkdir -p /opt/team-c/releases
            sudo mkdir -p /opt/team-c/shared

            # The SSH account is ubuntu; releases are operated by deployer.
            if ! id deployer >/dev/null 2>&1; then
              echo "Required Linux user 'deployer' does not exist."
              exit 1
            fi

            sudo chown -R deployer:deployer /opt/team-c

            RELEASE_DIR="/opt/team-c/releases/${{ env.IMAGE_TAG }}"
            sudo -u deployer mkdir -p "$RELEASE_DIR"

            sudo cp /tmp/team-c-deploy/deploy/staging/docker-compose.yml \
              "$RELEASE_DIR/docker-compose.yml"

            sudo cp /tmp/team-c-nginx/nginx.conf \
              "$RELEASE_DIR/nginx.conf"

            sudo tar -xzf /tmp/team-c-monitoring/monitoring-config.tar.gz \
              -C "$RELEASE_DIR"

            sudo chown -R deployer:deployer "$RELEASE_DIR"

            test -f "$RELEASE_DIR/docker-compose.yml"
            test -f "$RELEASE_DIR/nginx.conf"
            test -f "$RELEASE_DIR/monitoring/prometheus/prometheus.yml"
            test -f "$RELEASE_DIR/monitoring/prometheus/alerts.yml"
            test -f "$RELEASE_DIR/monitoring/alertmanager/alertmanager.yml"
            test -f "$RELEASE_DIR/monitoring/grafana/dashboards/team-c.json"

            echo "Release files prepared successfully."

      # 9. Validate Compose and deploy the stack.
      - name: Deploy application and monitoring
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.set_image_tag.outputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,GRAFANA_ADMIN_PASSWORD
          script: |
            set -eu

            RELEASE_DIR="/opt/team-c/releases/${IMAGE_TAG}"

            if [ -z "$DOCKERHUB_USERNAME" ] ||
               [ -z "$DOCKERHUB_TOKEN" ] ||
               [ -z "$GRAFANA_ADMIN_PASSWORD" ]; then
              echo "A required deployment secret is missing."
              exit 1
            fi

            # Do not print secret values in workflow logs.
            printf 'IMAGE_TAG=%s\nDOCKERHUB_USERNAME=%s\nGRAFANA_ADMIN_PASSWORD=%s\n' \
              "$IMAGE_TAG" \
              "$DOCKERHUB_USERNAME" \
              "$GRAFANA_ADMIN_PASSWORD" \
              | sudo -u deployer tee "$RELEASE_DIR/.env" >/dev/null

            sudo chmod 600 "$RELEASE_DIR/.env"
            sudo chown deployer:deployer "$RELEASE_DIR/.env"

            cd "$RELEASE_DIR"

            echo "Validating Docker Compose configuration..."
            sudo -u deployer docker compose \
              --env-file "$RELEASE_DIR/.env" \
              -f "$RELEASE_DIR/docker-compose.yml" \
              config -q

            echo "$DOCKERHUB_TOKEN" | sudo -u deployer docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

            echo "Pulling required images..."
            sudo -u deployer docker compose \
              --env-file "$RELEASE_DIR/.env" \
              -f "$RELEASE_DIR/docker-compose.yml" \
              pull

            echo "Starting application and monitoring stack..."
            sudo -u deployer docker compose \
              --env-file "$RELEASE_DIR/.env" \
              -f "$RELEASE_DIR/docker-compose.yml" \
              up -d --remove-orphans

            echo "Waiting for services..."
            sleep 20

            echo "Container status:"
            sudo -u deployer docker compose \
              --env-file "$RELEASE_DIR/.env" \
              -f "$RELEASE_DIR/docker-compose.yml" \
              ps

            echo "Checking backend health..."
            sudo -u deployer docker compose \
              --env-file "$RELEASE_DIR/.env" \
              -f "$RELEASE_DIR/docker-compose.yml" \
              exec -T backend \
              wget -qO- http://localhost:5000/api/health

            echo ""
            echo "Checking public frontend..."
            curl --fail --silent --show-error --max-time 30 \
              http://localhost/ >/dev/null

            echo "Checking public API..."
            curl --fail --silent --show-error --max-time 30 \
              http://localhost/api/health

            echo ""
            echo "Checking Prometheus configuration..."
            sudo -u deployer docker compose \
              --env-file "$RELEASE_DIR/.env" \
              -f "$RELEASE_DIR/docker-compose.yml" \
              exec -T prometheus \
              promtool check config /etc/prometheus/prometheus.yml

            echo ""
            echo "STAGING DEPLOYMENT SUCCESSFUL"
            echo "Image tag: $IMAGE_TAG"
            echo "Release directory: $RELEASE_DIR"
