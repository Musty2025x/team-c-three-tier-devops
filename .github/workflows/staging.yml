name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_IMAGE: musty101/team-c-backend
  FRONTEND_IMAGE: musty101/team-c-frontend

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e

            sudo mkdir -p /opt/team-c/releases/${IMAGE_TAG}
            sudo chown -R deployer:deployer /opt/team-c

            cd /opt/team-c/releases/${IMAGE_TAG}

            cat > docker-compose.yml <<EOF
            services:
              backend:
                image: ${DOCKERHUB_USERNAME}/team-c-backend:${IMAGE_TAG}
                restart: unless-stopped
                environment:
                  PORT: 5000
                  DATABASE_URL: postgresql://teamc:teamc@postgres:5432/teamc
                depends_on:
                  postgres:
                    condition: service_healthy

              frontend:
                image: ${DOCKERHUB_USERNAME}/team-c-frontend:${IMAGE_TAG}
                restart: unless-stopped
                depends_on:
                  - backend

              postgres:
                image: postgres:16-alpine
                restart: unless-stopped
                environment:
                  POSTGRES_USER: teamc
                  POSTGRES_PASSWORD: teamc
                  POSTGRES_DB: teamc
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U teamc -d teamc"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

            volumes:
              postgres_data:
            EOF

            echo "${DOCKERHUB_TOKEN}" | docker login \
              -u "${DOCKERHUB_USERNAME}" \
              --password-stdin

            docker compose pull
            docker compose up -d

            docker image prune -f

            echo "Waiting for application..."
            sleep 15

            docker compose ps

            echo "Checking backend health..."
            docker compose exec -T backend \
              wget -qO- http://localhost:5000/api/health

            echo ""
            echo "Staging deployment successful."