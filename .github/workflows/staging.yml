name: Deploy Staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag / Git commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

env:
  BACKEND_IMAGE: musty101/team-c-backend
  FRONTEND_IMAGE: musty101/team-c-frontend

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    # Automatically deploy only when CI succeeds on main.
    # Also allow manual deployment through workflow_dispatch.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout exact commit that CI built
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # ==========================================
      # SET IMAGE TAG
      # ==========================================

      - name: Set deployment image tag
        run: |
          set -e

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          fi

          echo "Deployment image tag:"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "${{ inputs.image_tag }}"
          else
            echo "${{ github.event.workflow_run.head_sha }}"
          fi

      # ==========================================
      # VERIFY LOCAL DEPLOYMENT FILES
      # ==========================================

      - name: Verify staging deployment files
        run: |
          set -e

          echo "Checking staging Docker Compose file..."
          test -f deploy/staging/docker-compose.yml

          echo "Checking Nginx configuration..."
          test -f nginx/nginx.conf

          echo ""
          echo "Deployment files found:"
          ls -lah deploy/staging/docker-compose.yml
          ls -lah nginx/nginx.conf

      # ==========================================
      # COPY DOCKER COMPOSE FILE TO EC2
      # ==========================================

      - name: Copy staging Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: deploy/staging/docker-compose.yml
          target: /tmp/team-c-deploy

      # ==========================================
      # COPY NGINX CONFIGURATION TO EC2
      # ==========================================

      - name: Copy Nginx configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: nginx/nginx.conf
          target: /tmp/team-c-nginx
          strip_components: 1

      # ==========================================
      # REMOTE VERIFICATION
      # ==========================================

      - name: Verify uploaded deployment files on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true

          script: |
            set -e

            echo "=========================================="
            echo "Verifying uploaded deployment files"
            echo "=========================================="

            echo ""
            echo "Checking Docker Compose file..."

            test -f /tmp/team-c-deploy/deploy/staging/docker-compose.yml

            echo "Docker Compose file found:"
            ls -lah /tmp/team-c-deploy/deploy/staging/docker-compose.yml

            echo ""
            echo "Checking Nginx configuration..."

            test -f /tmp/team-c-nginx/nginx.conf

            echo "Nginx configuration found:"
            ls -lah /tmp/team-c-nginx/nginx.conf

            echo ""
            echo "Uploaded files verified successfully."

      # ==========================================
      # DEPLOY TO STAGING
      # ==========================================

      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.0

        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN

          script: |
            set -e

            echo "=========================================="
            echo "Starting staging deployment"
            echo "=========================================="

            echo "Image tag:"
            echo "${IMAGE_TAG}"

            RELEASE_DIR="/opt/team-c/releases/${IMAGE_TAG}"

            # ==========================================
            # CREATE RELEASE DIRECTORY
            # ==========================================

            echo ""
            echo "Creating release directory..."

            sudo mkdir -p "${RELEASE_DIR}"

            sudo chown -R deployer:deployer /opt/team-c

            # ==========================================
            # COPY DOCKER COMPOSE FILE
            # ==========================================

            echo ""
            echo "Copying Docker Compose file..."

            sudo cp \
              /tmp/team-c-deploy/deploy/staging/docker-compose.yml \
              "${RELEASE_DIR}/docker-compose.yml"

            # ==========================================
            # COPY NGINX CONFIGURATION
            # ==========================================

            echo ""
            echo "Copying Nginx configuration..."

            sudo cp \
              /tmp/team-c-nginx/nginx.conf \
              "${RELEASE_DIR}/nginx.conf"

            # ==========================================
            # SET FILE OWNERSHIP
            # ==========================================

            echo ""
            echo "Setting file ownership..."

            sudo chown deployer:deployer \
              "${RELEASE_DIR}/docker-compose.yml" \
              "${RELEASE_DIR}/nginx.conf"

            # ==========================================
            # VERIFY RELEASE FILES
            # ==========================================

            echo ""
            echo "=========================================="
            echo "Verifying release files"
            echo "=========================================="

            test -f "${RELEASE_DIR}/docker-compose.yml"
            test -f "${RELEASE_DIR}/nginx.conf"

            echo ""
            echo "Release files:"
            ls -lah "${RELEASE_DIR}"

            # ==========================================
            # CREATE ENVIRONMENT FILE
            # ==========================================

            echo ""
            echo "Creating environment file..."

            printf 'IMAGE_TAG=%s\nDOCKERHUB_USERNAME=%s\n' \
              "${IMAGE_TAG}" \
              "${DOCKERHUB_USERNAME}" \
              | sudo tee "${RELEASE_DIR}/.env" > /dev/null

            sudo chown deployer:deployer \
              "${RELEASE_DIR}/.env"

            # ==========================================
            # VALIDATE DOCKER COMPOSE
            # ==========================================

            echo ""
            echo "=========================================="
            echo "Validating Docker Compose configuration"
            echo "=========================================="

            sudo -u deployer docker compose \
              --env-file "${RELEASE_DIR}/.env" \
              -f "${RELEASE_DIR}/docker-compose.yml" \
              config

            echo ""
            echo "Docker Compose configuration is valid."

            # ==========================================
            # LOGIN TO DOCKER HUB
            # ==========================================

            echo ""
            echo "=========================================="
            echo "Logging into Docker Hub"
            echo "=========================================="

            echo "${DOCKERHUB_TOKEN}" \
              | sudo -u deployer docker login \
                --username "${DOCKERHUB_USERNAME}" \
                --password-stdin

            echo ""
            echo "Docker Hub login successful."

            # ==========================================
            # PULL APPLICATION IMAGES
            # ==========================================

            echo ""
            echo "=========================================="
            echo "Pulling application images"
            echo "=========================================="

            sudo -u deployer docker compose \
              --env-file "${RELEASE_DIR}/.env" \
              -f "${RELEASE_DIR}/docker-compose.yml" \
              pull

            echo ""
            echo "Application images pulled successfully."

            # ==========================================
            # START APPLICATION
            # ==========================================

            echo ""
            echo "=========================================="
            echo "Starting staging application"
            echo "=========================================="

            sudo -u deployer docker compose \
              --env-file "${RELEASE_DIR}/.env" \
              -f "${RELEASE_DIR}/docker-compose.yml" \
              up -d

            # ==========================================
            # WAIT FOR APPLICATION
            # ==========================================

            echo ""
            echo "Waiting for application to start..."

            sleep 20

            # ==========================================
            # CONTAINER STATUS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "Container status"
            echo "=========================================="

            sudo -u deployer docker compose \
              --env-file "${RELEASE_DIR}/.env" \
              -f "${RELEASE_DIR}/docker-compose.yml" \
              ps

            # ==========================================
            # BACKEND HEALTH CHECK
            # ==========================================

            echo ""
            echo "=========================================="
            echo "Checking backend health"
            echo "=========================================="

            sudo -u deployer docker compose \
              --env-file "${RELEASE_DIR}/.env" \
              -f "${RELEASE_DIR}/docker-compose.yml" \
              exec -T backend \
              wget -qO- http://localhost:5000/api/health

            echo ""
            echo "Backend health check passed."

            # ==========================================
            # PUBLIC FRONTEND HEALTH CHECK
            # ==========================================

            echo ""
            echo "=========================================="
            echo "Checking public frontend"
            echo "=========================================="

            curl \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              http://localhost/

            echo ""
            echo "Public frontend is responding."

            # ==========================================
            # PUBLIC API HEALTH CHECK
            # ==========================================

            echo ""
            echo "=========================================="
            echo "Checking public API"
            echo "=========================================="

            curl \
              --fail \
              --silent \
              --show-error \
              --max-time 30 \
              http://localhost/api/health

            echo ""
            echo "Public API is responding."

            # ==========================================
            # DEPLOYMENT SUCCESS
            # ==========================================

            echo ""
            echo "=========================================="
            echo "STAGING DEPLOYMENT SUCCESSFUL"
            echo "=========================================="

            echo "Image tag:"
            echo "${IMAGE_TAG}"

            echo ""
            echo "Release directory:"
            echo "${RELEASE_DIR}"

            echo ""
            echo "Application is available on port 80."

            echo "=========================================="