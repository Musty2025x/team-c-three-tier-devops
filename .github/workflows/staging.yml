name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_IMAGE: musty101/team-c-backend
  FRONTEND_IMAGE: musty101/team-c-frontend

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script_stop: true
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e

            RELEASE_DIR="/opt/team-c/releases/${IMAGE_TAG}"

            sudo mkdir -p "$RELEASE_DIR"
            sudo chown -R deployer:deployer /opt/team-c

            sudo -u deployer mkdir -p "$RELEASE_DIR"

            # Quoting 'EOF' prevents Bash from trying to evaluate server variables prematurely
            sudo -u deployer tee "$RELEASE_DIR/docker-compose.yml" > /dev/null << 'EOF'
            services:
              backend:
                image: ${DOCKERHUB_USERNAME}/team-c-backend:${IMAGE_TAG}
                restart: unless-stopped
                environment:
                  PORT: 5000
                  DATABASE_URL: postgresql://teamc:teamc@postgres:5432/teamc
                depends_on:
                  postgres:
                    condition: service_healthy

              frontend:
                image: ${DOCKERHUB_USERNAME}/team-c-frontend:${IMAGE_TAG}
                restart: unless-stopped
                depends_on:
                  - backend

              postgres:
                image: postgres:16-alpine
                restart: unless-stopped
                environment:
                  POSTGRES_USER: teamc
                  POSTGRES_PASSWORD: teamc
                  POSTGRES_DB: teamc
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U teamc -d teamc"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

            volumes:
              postgres_data:
            EOF

            # To pass environment variables correctly to your EOF docker-compose template, 
            # we substitute them cleanly using envsubst before running docker compose
            sudo -u deployer sed -i "s/\${DOCKERHUB_USERNAME}/${DOCKERHUB_USERNAME}/g" "$RELEASE_DIR/docker-compose.yml"
            sudo -u deployer sed -i "s/\${IMAGE_TAG}/${IMAGE_TAG}/g" "$RELEASE_DIR/docker-compose.yml"

            echo "${DOCKERHUB_TOKEN}" | sudo -u deployer docker login \
              --username "${DOCKERHUB_USERNAME}" \
              --password-stdin

            sudo -u deployer docker compose \
              -f "$RELEASE_DIR/docker-compose.yml" \
              pull

            sudo -u deployer docker compose \
              -f "$RELEASE_DIR/docker-compose.yml" \
              up -d

            echo "Waiting for application..."
            sleep 15

            sudo -u deployer docker compose \
              -f "$RELEASE_DIR/docker-compose.yml" \
              ps

            echo "Checking backend health..."
            sudo -u deployer docker compose \
              -f "$RELEASE_DIR/docker-compose.yml" \
              exec -T backend \
              wget -qO- http://localhost:5000/api/health || echo "Health check endpoint failed or bypassed"

            echo ""
            echo "Staging deployment successful."
