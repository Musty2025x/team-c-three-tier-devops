name: Deploy Staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag or commit SHA to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:
      - name: Checkout deployment commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set image tag
        id: set_image_tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_IMAGE_TAG"
          else
            TAG="$WORKFLOW_SHA"
          fi

          if [[ -z "$TAG" ]] ||
             [[ ! "$TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid or empty Docker image tag."
            exit 1
          fi

          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "image_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deployment image tag: $TAG"

      - name: Verify deployment files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            deploy/staging/docker-compose.yml
            nginx/nginx.conf
            monitoring/prometheus/prometheus.yml
            monitoring/prometheus/alerts.yml
            monitoring/alertmanager/alertmanager.yml
            monitoring/grafana/provisioning/datasources/datasource.yml
            monitoring/grafana/provisioning/dashboards/dashboard.yml
            monitoring/grafana/dashboards/team-c.json
          )

          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file is missing: $file"
              exit 1
            fi
            echo "Found: $file"
          done

          echo "All required files are present."

      - name: Package monitoring configuration
        shell: bash
        run: |
          set -euo pipefail
          tar -czf monitoring-config.tar.gz monitoring/
          test -s monitoring-config.tar.gz
          echo "Monitoring archive created."

      - name: Copy staging Compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: deploy/staging/docker-compose.yml
          target: /tmp/team-c-deploy

      - name: Copy Nginx configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: nginx/nginx.conf
          target: /tmp/team-c-nginx
          strip_components: 1

      - name: Copy monitoring archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          source: monitoring-config.tar.gz
          target: /tmp/team-c-monitoring

      - name: Prepare staging release
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.set_image_tag.outputs.image_tag }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 2m
          envs: IMAGE_TAG
          script: |
            set -eu

            echo "========== STAGING PREPARATION =========="
            echo "SSH user: $(whoami)"
            echo "Host: $(hostname)"
            hostname -I || true

            if [ -z "${IMAGE_TAG:-}" ]; then
              echo "ERROR: IMAGE_TAG was not passed to the remote host."
              exit 1
            fi

            echo "Image tag: $IMAGE_TAG"

            echo "Checking transferred files..."
            test -f /tmp/team-c-deploy/deploy/staging/docker-compose.yml
            test -f /tmp/team-c-nginx/nginx.conf
            test -f /tmp/team-c-monitoring/monitoring-config.tar.gz
            echo "Transferred files verified."

            echo "Checking sudo access..."
            sudo -n true

            echo "Checking deployer account..."
            if ! id deployer >/dev/null 2>&1; then
              sudo -n useradd -m -s /bin/bash deployer
            fi

            if ! getent group docker >/dev/null 2>&1; then
              echo "ERROR: Docker group does not exist."
              exit 1
            fi

            sudo -n usermod -aG docker deployer
            id deployer

            echo "Checking Docker access..."
            sudo -n -u deployer docker ps
            sudo -n -u deployer docker compose version

            echo "Preparing release directories..."
            sudo -n mkdir -p /opt/team-c/releases /opt/team-c/shared
            sudo -n chown deployer:deployer /opt/team-c
            sudo -n chown deployer:deployer /opt/team-c/releases
            sudo -n chown deployer:deployer /opt/team-c/shared

            RELEASE_DIR="/opt/team-c/releases/${IMAGE_TAG}"
            sudo -n -u deployer mkdir -p "$RELEASE_DIR"

            echo "Installing Compose file..."
            sudo -n cp \
              /tmp/team-c-deploy/deploy/staging/docker-compose.yml \
              "$RELEASE_DIR/docker-compose.yml"

            echo "Installing Nginx configuration..."
            sudo -n cp \
              /tmp/team-c-nginx/nginx.conf \
              "$RELEASE_DIR/nginx.conf"

            echo "Installing monitoring configuration..."
            sudo -n tar -xzf \
              /tmp/team-c-monitoring/monitoring-config.tar.gz \
              -C "$RELEASE_DIR"

            sudo -n chown -R deployer:deployer "$RELEASE_DIR"

            echo "Verifying installed files..."
            test -f "$RELEASE_DIR/docker-compose.yml"
            test -f "$RELEASE_DIR/nginx.conf"
            test -f "$RELEASE_DIR/monitoring/prometheus/prometheus.yml"
            test -f "$RELEASE_DIR/monitoring/prometheus/alerts.yml"
            test -f "$RELEASE_DIR/monitoring/alertmanager/alertmanager.yml"
            test -f "$RELEASE_DIR/monitoring/grafana/dashboards/team-c.json"

            echo "Release files prepared successfully."
            echo "Release directory: $RELEASE_DIR"

      - name: Deploy application and monitoring
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.set_image_tag.outputs.image_tag }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 10m
          envs: IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,GRAFANA_ADMIN_PASSWORD
          script: |
            set -eu

            echo "========== STAGING DEPLOYMENT =========="

            echo "Checking deployment variables..."

            if [ -z "${IMAGE_TAG:-}" ]; then
              echo "ERROR: IMAGE_TAG is empty."
              exit 1
            fi
            echo "IMAGE_TAG check passed."

            if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
              echo "ERROR: DOCKERHUB_USERNAME is empty."
              exit 1
            fi
            echo "DOCKERHUB_USERNAME check passed."

            if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
              echo "ERROR: DOCKERHUB_TOKEN is empty."
              exit 1
            fi
            echo "DOCKERHUB_TOKEN check passed."

            if [ -z "${GRAFANA_ADMIN_PASSWORD:-}" ]; then
              echo "ERROR: GRAFANA_ADMIN_PASSWORD is empty."
              exit 1
            fi
            echo "GRAFANA_ADMIN_PASSWORD check passed."

            echo "All deployment variables validated."

            RELEASE_DIR="/opt/team-c/releases/${IMAGE_TAG}"
            COMPOSE_FILE="$RELEASE_DIR/docker-compose.yml"
            ENV_FILE="$RELEASE_DIR/.env"

            echo "Image tag: $IMAGE_TAG"
            echo "Release directory: $RELEASE_DIR"

            echo "Checking release directory..."
            if [ ! -d "$RELEASE_DIR" ]; then
              echo "ERROR: Release directory does not exist."
              exit 1
            fi

            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "ERROR: Compose file is missing."
              exit 1
            fi

            echo "Checking deployer and Docker..."
            id deployer
            sudo -n -u deployer docker ps

            echo "Creating deployment environment file..."
            if ! printf \
              'IMAGE_TAG=%s\nDOCKERHUB_USERNAME=%s\nGRAFANA_ADMIN_PASSWORD=%s\n' \
              "$IMAGE_TAG" \
              "$DOCKERHUB_USERNAME" \
              "$GRAFANA_ADMIN_PASSWORD" |
              sudo -n -u deployer tee "$ENV_FILE" >/dev/null; then
              echo "ERROR: Could not create the environment file."
              exit 1
            fi

            sudo -n chmod 600 "$ENV_FILE"
            sudo -n chown deployer:deployer "$ENV_FILE"

            if sudo -n test -s "$ENV_FILE"; then
              echo "Environment file created successfully."
            else
              echo "ERROR: Environment file is missing or empty."
              exit 1
            fi

            echo "Validating Docker Compose configuration..."
            if ! sudo -n -u deployer docker compose \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" config -q; then
              echo "ERROR: Docker Compose validation failed."
              exit 1
            fi
            echo "Compose configuration is valid."

            echo "Logging in to Docker Hub..."
            if ! printf '%s' "$DOCKERHUB_TOKEN" |
              sudo -n -u deployer docker login \
                --username "$DOCKERHUB_USERNAME" \
                --password-stdin; then
              echo "ERROR: Docker Hub login failed."
              exit 1
            fi
            echo "Docker Hub login succeeded."

            echo "Pulling required images..."
            if ! sudo -n -u deployer docker compose \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" pull; then
              echo "ERROR: Docker image pull failed."
              exit 1
            fi
            echo "Image pull completed."

            echo "Starting application and monitoring..."
            if ! sudo -n -u deployer docker compose \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" up -d --remove-orphans; then
              echo "ERROR: Docker Compose failed to start the stack."

              sudo -n -u deployer docker compose \
                --env-file "$ENV_FILE" \
                -f "$COMPOSE_FILE" ps -a || true

              sudo -n -u deployer docker compose \
                --env-file "$ENV_FILE" \
                -f "$COMPOSE_FILE" logs --tail=80 || true

              exit 1
            fi

            echo "Waiting for services to initialize..."
            sleep 20

            echo "Container status:"
            sudo -n -u deployer docker compose \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" ps -a

            echo "Checking backend health..."
            if ! sudo -n -u deployer docker compose \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" exec -T backend \
              wget -qO- http://localhost:5000/api/health; then
              echo "ERROR: Backend health check failed."

              sudo -n -u deployer docker compose \
                --env-file "$ENV_FILE" \
                -f "$COMPOSE_FILE" logs --tail=100 backend || true

              exit 1
            fi

            echo ""
            echo "Checking frontend through Nginx..."
            if ! curl --fail --silent --show-error --max-time 30 \
              http://localhost/ >/dev/null; then
              echo "ERROR: Frontend health check failed."

              sudo -n -u deployer docker compose \
                --env-file "$ENV_FILE" \
                -f "$COMPOSE_FILE" logs --tail=80 nginx frontend || true

              exit 1
            fi

            echo "Frontend check passed."

            echo "Checking public API route..."
            if ! curl --fail --silent --show-error --max-time 30 \
              http://localhost/api/health; then
              echo "ERROR: Public API health check failed."

              sudo -n -u deployer docker compose \
                --env-file "$ENV_FILE" \
                -f "$COMPOSE_FILE" logs --tail=100 nginx backend || true

              exit 1
            fi

            echo ""
            echo "Checking Prometheus configuration..."
            if ! sudo -n -u deployer docker compose \
              --env-file "$ENV_FILE" \
              -f "$COMPOSE_FILE" exec -T prometheus \
              promtool check config /etc/prometheus/prometheus.yml; then
              echo "ERROR: Prometheus configuration check failed."

              sudo -n -u deployer docker compose \
                --env-file "$ENV_FILE" \
                -f "$COMPOSE_FILE" logs --tail=80 prometheus || true

              exit 1
            fi

            echo ""
            echo "========================================="
            echo "STAGING DEPLOYMENT SUCCESSFUL"
            echo "Image tag: $IMAGE_TAG"
            echo "Release directory: $RELEASE_DIR"
            echo "========================================="

      - name: Diagnose staging deployment failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ steps.set_image_tag.outputs.image_tag }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          command_timeout: 2m
          envs: IMAGE_TAG
          script: |
            set -u

            echo "========== FAILURE DIAGNOSTICS =========="
            echo "Host: $(hostname)"
            echo "SSH user: $(whoami)"
            echo "Image tag: ${IMAGE_TAG:-not-set}"

            echo "Docker service status:"
            sudo -n systemctl is-active docker || true

            echo "Docker containers:"
            sudo -n docker ps -a || true

            if [ -n "${IMAGE_TAG:-}" ]; then
              RELEASE_DIR="/opt/team-c/releases/${IMAGE_TAG}"
              COMPOSE_FILE="$RELEASE_DIR/docker-compose.yml"
              ENV_FILE="$RELEASE_DIR/.env"

              echo "Release directory listing:"
              sudo -n ls -lah "$RELEASE_DIR" || true

              if sudo -n test -f "$COMPOSE_FILE"; then
                if sudo -n test -f "$ENV_FILE"; then
                  echo "Compose service status:"
                  sudo -n -u deployer docker compose \
                    --env-file "$ENV_FILE" \
                    -f "$COMPOSE_FILE" ps -a || true

                  echo "Recent service logs:"
                  sudo -n -u deployer docker compose \
                    --env-file "$ENV_FILE" \
                    -f "$COMPOSE_FILE" logs --tail=60 || true
                else
                  echo "Environment file was not created."
                fi
              fi
            fi

            echo "========== END DIAGNOSTICS =========="      