
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamc
      POSTGRES_PASSWORD: ${PRODUCTION_DB_PASSWORD:?Production database password is required}
      POSTGRES_DB: teamc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamc -d teamc"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app

  backend:
    image: ${DOCKERHUB_USERNAME:?Docker Hub username is required}/team-c-backend:${IMAGE_TAG:?Image tag is required}
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://teamc:${PRODUCTION_DB_PASSWORD}@postgres:5432/teamc
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app

  frontend:
    image: ${DOCKERHUB_USERNAME:?Docker Hub username is required}/team-c-frontend:${IMAGE_TAG:?Image tag is required}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - app

volumes:
  postgres_data:

networks:
  app:
    driver: bridge