
groups:
  - name: team-c-alerts
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Team C backend is down
          description: The Team C backend has been unavailable for more than one minute.

      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Team C Prometheus is down
          description: Prometheus has been unable to scrape its own metrics endpoint for more than one minute.

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Team C Alertmanager is down
          description: Prometheus cannot reach Alertmanager to deliver notifications.

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High HTTP error rate
          description: More than 5 percent of requests are returning 5xx responses.
