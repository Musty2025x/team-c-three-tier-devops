global:
  resolve_timeout: 5m

route:
  receiver: team-c-slack
  group_by:
    - alertname
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: team-c-slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
        title: >-
          [{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Labels.alertname }}
          *Severity:* {{ .Labels.severity | toUpper }}
          *Summary:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Status:* {{ .Status | toUpper }}
          *Started:* {{ .StartsAt }}
          {{ if .GeneratorURL }}<{{ .GeneratorURL }}|View in Prometheus>{{ end }}
          {{ end }}
          <{{ .ExternalURL }}|Open Alertmanager>