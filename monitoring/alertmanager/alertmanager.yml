global:
  resolve_timeout: 5m

route:
  receiver: team-c-slack
  group_by:
    - alertname
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: team-c-slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
        title: >-
          [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
        text: >-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          *Status:* {{ .Status }}
          {{ end }}